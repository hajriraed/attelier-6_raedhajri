<head>

<script>
 function envoi() {
    let s1=document.getElementById("sel1").selectedIndex;
    let prix1=document.getElementById("sel1").options[s1].value;


    let s2=document.getElementById("sel2").length;
    let s=0;
    for (let i = 0; i <s2; i++){
        if (document.getElementById("sel2").option[i].selected) {
            s=s+Number(document.getElementById("sel2").options[i].value);
        }
        
    }
    let s3=document.getElementById("sel3").selectedIndex;
    let prix3=document.getElementById("sel3").options[s3].value;
    let res=Number(prix1)+s+Number(prix3);
    document.getElementById('menu').value="prix a payer" +"\n"+"entree:"+prix1+"\n"+
    "plat"+s+"\n"+"Desert:"+prix3+"\n"+"total:"+res;
 }
</script>
<body>

    <p>choisissez un entrée , un plat et un desert,puis appuyez sur le bouton "Envoi".</p>
    <br>

    </select>
    <input type="submit" value="envoi" onclick="envoi()">
</body>
</html>
